name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated stable tag; required when dispatching from main
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Package versions are shared across runtime tags. Serialize lookup and upload.
  group: stable-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    name: Verify and publish stable release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate stable semantic version tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags are accepted." >&2
            exit 1
          fi
          # actions/checkout can rewrite the local annotated tag ref to the
          # peeled commit when checking out a workflow_dispatch tag. Restore
          # its exact remote tag object before checking annotation integrity.
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_object_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [[ "${tag_object_type}" != "tag" ]]; then
            echo "Release tags must be annotated tags." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checked-out source must be the exact tagged commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${tag_commit}" FETCH_HEAD; then
            echo "The tagged commit must already be reachable from origin/main." >&2
            exit 1
          fi
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1
      - name: Provider fixture tests
        run: go test -tags providerfixture ./... -count=1
      - name: Verify non-deployable MAS source contract candidate
        run: python3 contracts/mas-owner-candidate/verify.py
      - name: Vet
        run: go vet ./...
      - name: Provider fixture vet
        run: go vet -tags providerfixture ./...
      - name: Acceptance tooling vet
        run: go vet -tags acceptance ./scripts/acceptance/
      - name: Race
        run: go test -race -count=1 ./internal/artifactchannel/ ./internal/provider/ ./internal/providerapp/ ./internal/sbi/executor/ ./internal/catalog/
      - name: Provider fixture race
        run: go test -tags providerfixture -race -count=1 ./internal/providerapp/ ./internal/catalog/ ./internal/artifactchannel/
      - name: Build all packages
        run: go build ./...
      - name: Build and validate MAS contract assets
        id: mas
        # The historical v1.0.0 tag predates MAS packaging.
        if: env.RELEASE_TAG != 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 contracts/mas-owner-candidate/release_package.py \
            --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" --output dist --package-version 0.3.0 --reuse-github-archive
          echo "record=dist/mas-runtime-compatibility.json" >> "$GITHUB_OUTPUT"
      - name: Generate Compiler Interface Package and Provider manifest
        shell: bash
        run: |
          set -euo pipefail
          version_number="${RELEASE_TAG#v}"
          rm -rf "${RUNNER_TEMP}/release"
          go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/ca-client-tools-release" ./cmd/ca-client-tools-release
          "${RUNNER_TEMP}/ca-client-tools-release" generate \
            --out "${RUNNER_TEMP}/release" \
            --version "${version_number}" --provider-version "${version_number}" \
            | tee "${RUNNER_TEMP}/release-identity.json"
          "${RUNNER_TEMP}/ca-client-tools-release" verify \
            --out "${RUNNER_TEMP}/release" \
            --version "${version_number}" --provider-version "${version_number}"
      - name: Compiler v2.1.0 interface link gate
        shell: bash
        run: |
          set -euo pipefail
          # Pinned real Compiler release: the generated Interface Package, its
          # Callable and its Capability must link through `build-development`,
          # and a broken $ref must fail closed.
          curl -fsSLo "${RUNNER_TEMP}/skillc" \
            https://github.com/odango-chan/ca-skill-compiler/releases/download/v2.1.0/skillc-v2.1.0-linux-amd64
          echo "11da056ae5fff416de1fcfacd0a3535a4392a2b2d7349d928f41e1928398b568  ${RUNNER_TEMP}/skillc" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/skillc"
          CA_SKILLC="${RUNNER_TEMP}/skillc" go test ./internal/interfacepkg -count=1 -v
      - name: Build release archives and standalone Interface Package ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          version_number="${version#v}"
          commit="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_dir="${RUNNER_TEMP}/release"
          generator="${RUNNER_TEMP}/ca-client-tools-release"
          mkdir -p dist

          build_target() {
            local goos="$1"
            local goarch="$2"
            local extension="$3"
            local archive="$4"
            local name="ca-client-tools_${version_number}_${goos}_${goarch}"
            local stage="${RUNNER_TEMP}/${name}"
            rm -rf "$stage"
            mkdir -p "$stage"

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath -buildvcs=false \
              -ldflags="-s -w -X github.com/odango-chan/ca-client-tools/internal/cli.Version=${version} -X github.com/odango-chan/ca-client-tools/internal/cli.GitCommit=${commit} -X github.com/odango-chan/ca-client-tools/internal/cli.BuildDate=${build_date} -X github.com/odango-chan/ca-client-tools/internal/providerapp.ProviderVersion=${version_number}" \
              -o "${stage}/ca-client-tools${extension}" ./cmd/ca-client-tools

            cp README.md CHANGELOG.md "$stage/"
            cp "${release_dir}/provider.yaml" "$stage/"
            cp -R "${release_dir}/interface" "$stage/interface"

            # The packaged interface and runtime binding must be byte-identical
            # to the one canonical generation, and the binary identity/version/
            # catalog digest must agree with provider.yaml.
            "${generator}" verify --out "$stage" \
              --version "${version_number}" --provider-version "${version_number}"
            diff -r "${release_dir}/interface" "$stage/interface"

            if [[ "$archive" == "zip" ]]; then
              (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/dist/${name}.zip" "${name}")
            else
              tar -C "${RUNNER_TEMP}" -czf "${GITHUB_WORKSPACE}/dist/${name}.tar.gz" "${name}"
            fi
            if [[ "$goos" == "linux" && "$goarch" == "amd64" ]]; then
              expected="ca-client-tools ${version} (commit ${commit}; built ${build_date})"
              actual="$(cd "$stage" && ./ca-client-tools --version)"
              test "${actual}" = "${expected}"
            fi
            rm -rf "$stage"
          }

          build_target windows amd64 .exe zip
          build_target linux amd64 "" tar.gz
          build_target linux arm64 "" tar.gz

          # One Interface Package snapshot, published once as an OS-neutral ZIP.
          # package.json is at the archive root and no binary, provider.yaml or
          # private binding is included.
          interface_zip="dist/ca-client-tools_interface_${version_number}.zip"
          rm -f "$interface_zip"
          (cd "${release_dir}/interface" && zip -qr "${GITHUB_WORKSPACE}/${interface_zip}" .)

          # Extract every published archive and prove the interface tree and
          # provider.yaml are the exact canonical bytes.
          check_dir="${RUNNER_TEMP}/check"
          for archive in dist/ca-client-tools_${version_number}_*.zip dist/ca-client-tools_${version_number}_*.tar.gz; do
            rm -rf "$check_dir"
            mkdir -p "$check_dir"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$check_dir" ;;
              *.tar.gz) tar -C "$check_dir" -xzf "$archive" ;;
            esac
            package_root="$(find "$check_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            diff -r "${release_dir}/interface" "${package_root}/interface"
            cmp "${release_dir}/provider.yaml" "${package_root}/provider.yaml"
            "${generator}" verify --out "$package_root" \
              --version "${version_number}" --provider-version "${version_number}"
          done

          rm -rf "$check_dir"
          mkdir -p "$check_dir"
          unzip -q "$interface_zip" -d "$check_dir"
          diff -r "${release_dir}/interface" "$check_dir"
          if unzip -l "$interface_zip" | grep -Eq '(^|/)ca-client-tools(\.exe)?$|provider\.yaml|contracts/'; then
            echo "Interface Package ZIP must not contain the binary or private bindings." >&2
            exit 1
          fi
          test -f "$check_dir/package.json"

          (
            cd dist
            assets=(ca-client-tools_*.zip ca-client-tools_*.tar.gz)
            if [[ -f mas-runtime-compatibility.json ]]; then
              assets+=(mas-runtime-compatibility.json)
            fi
            # Every published ZIP/TAR.GZ is covered, including the independent
            # non-linkable MAS contract candidate archive when present.
            for candidate in openamsm-mas-compiler-contract-v*.zip; do
              if [[ -e "$candidate" ]]; then
                assets+=("$candidate")
              fi
            done
            sha256sum "${assets[@]}" > SHA256SUMS
          )
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            ${{ steps.mas.outputs.record }}
            dist/SHA256SUMS
      - name: Verify published release assets and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_number="${RELEASE_TAG#v}"
          published="${RUNNER_TEMP}/published"
          rm -rf "$published"
          mkdir -p "$published"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$published" \
            --pattern 'ca-client-tools_*' --pattern 'mas-runtime-compatibility.json' \
            --pattern 'openamsm-mas-compiler-contract-*.zip' --pattern 'SHA256SUMS' --clobber
          (cd "$published" && sha256sum -c SHA256SUMS)
          for asset in \
            "ca-client-tools_${version_number}_linux_amd64.tar.gz" \
            "ca-client-tools_${version_number}_linux_arm64.tar.gz" \
            "ca-client-tools_${version_number}_windows_amd64.zip" \
            "ca-client-tools_interface_${version_number}.zip"; do
            test -s "${published}/${asset}"
          done
          echo "Release assets and SHA256SUMS verified for ${RELEASE_TAG}."
