name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated stable tag; required when dispatching from main
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Package versions are shared across runtime tags. Serialize lookup and upload.
  group: stable-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    name: Verify and publish stable release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate stable semantic version tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags are accepted." >&2
            exit 1
          fi
          # actions/checkout can rewrite the local annotated tag ref to the
          # peeled commit when checking out a workflow_dispatch tag. Restore
          # its exact remote tag object before checking annotation integrity.
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_object_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [[ "${tag_object_type}" != "tag" ]]; then
            echo "Release tags must be annotated tags." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checked-out source must be the exact tagged commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${tag_commit}" FETCH_HEAD; then
            echo "The tagged commit must already be reachable from origin/main." >&2
            exit 1
          fi
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1
      - name: Provider fixture tests
        run: go test -tags providerfixture ./... -count=1
      - name: Verify non-deployable MAS source contract candidate
        run: python3 contracts/mas-owner-candidate/verify.py
      - name: Vet
        run: go vet ./...
      - name: Provider fixture vet
        run: go vet -tags providerfixture ./...
      - name: Acceptance tooling vet
        run: go vet -tags acceptance ./scripts/acceptance/
      - name: Race
        run: go test -race -count=1 ./internal/artifactchannel/ ./internal/provider/ ./internal/providerapp/ ./internal/sbi/executor/ ./internal/catalog/
      - name: Provider fixture race
        run: go test -tags providerfixture -race -count=1 ./internal/providerapp/ ./internal/catalog/ ./internal/artifactchannel/
      - name: Build all packages
        run: go build ./...
      - name: Build and validate MAS contract assets
        id: mas
        # The historical v1.0.0 tag predates MAS packaging.
        if: env.RELEASE_TAG != 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 contracts/mas-owner-candidate/release_package.py \
            --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" --output dist --package-version 0.3.0 --reuse-github-archive
          echo "record=dist/mas-runtime-compatibility.json" >> "$GITHUB_OUTPUT"
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          commit="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version_number="${version#v}"
          mkdir -p dist

          build_target() {
            local goos="$1"
            local goarch="$2"
            local extension="$3"
            local archive="$4"
            local name="ca-client-tools_${version_number}_${goos}_${goarch}"
            local stage="${RUNNER_TEMP}/${name}"
            mkdir -p "$stage"

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath -buildvcs=false \
              -ldflags="-s -w -X github.com/odango-chan/ca-client-tools/internal/cli.Version=${version} -X github.com/odango-chan/ca-client-tools/internal/cli.GitCommit=${commit} -X github.com/odango-chan/ca-client-tools/internal/cli.BuildDate=${build_date}" \
              -o "${stage}/ca-client-tools${extension}" ./cmd/ca-client-tools

            cp README.md CHANGELOG.md "$stage/"
            if [[ "$archive" == "zip" ]]; then
              (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/dist/${name}.zip" "${name}")
            else
              tar -C "${RUNNER_TEMP}" -czf "${GITHUB_WORKSPACE}/dist/${name}.tar.gz" "${name}"
            fi
            if [[ "$goos" == "linux" && "$goarch" == "amd64" ]]; then
              expected="ca-client-tools ${version} (commit ${commit}; built ${build_date})"
              actual="$("${stage}/ca-client-tools" --version)"
              test "${actual}" = "${expected}"
            fi
            rm -rf "$stage"
          }

          build_target windows amd64 .exe zip
          build_target linux amd64 "" tar.gz
          build_target linux arm64 "" tar.gz
          (
            cd dist
            assets=(ca-client-tools_*.zip ca-client-tools_*.tar.gz)
            if [[ -f mas-runtime-compatibility.json ]]; then
              assets+=(mas-runtime-compatibility.json)
            fi
            sha256sum "${assets[@]}" > SHA256SUMS
          )
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            ${{ steps.mas.outputs.record }}
            dist/SHA256SUMS
