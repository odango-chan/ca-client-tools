name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1
      - name: Provider fixture tests
        run: go test -tags providerfixture ./... -count=1
      - name: Verify non-deployable MAS source contract candidate
        run: |
          python3 contracts/mas-owner-candidate/verify.py
          python3 contracts/mas-owner-candidate/fixtures/test_contract_values.py
          python3 contracts/mas-owner-candidate/test_release_package.py
      - name: Vet
        run: go vet ./...
      - name: Provider fixture vet
        run: go vet -tags providerfixture ./...
      - name: Acceptance tooling vet
        run: go vet -tags acceptance ./scripts/acceptance/
      - name: Race
        run: go test -race -count=1 ./internal/artifactchannel/ ./internal/provider/ ./internal/providerapp/ ./internal/sbi/executor/ ./internal/catalog/
      - name: Provider fixture race
        run: go test -tags providerfixture -race -count=1 ./internal/providerapp/ ./internal/catalog/ ./internal/artifactchannel/
      - name: Build
        run: go build ./...
      - name: Generate and verify the release Interface Package
        run: |
          go run ./cmd/ca-client-tools-release generate --out "$RUNNER_TEMP/release" --version 0.0.0 --provider-version 0.0.0
          go run ./cmd/ca-client-tools-release verify --out "$RUNNER_TEMP/release" --version 0.0.0 --provider-version 0.0.0
      - name: Compiler v2.1.0 interface link gate
        run: |
          curl -fsSLo "$RUNNER_TEMP/skillc" https://github.com/odango-chan/ca-skill-compiler/releases/download/v2.1.0/skillc-v2.1.0-linux-amd64
          echo "11da056ae5fff416de1fcfacd0a3535a4392a2b2d7349d928f41e1928398b568  $RUNNER_TEMP/skillc" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/skillc"
          CA_SKILLC="$RUNNER_TEMP/skillc" go test ./internal/interfacepkg -count=1 -v
      - name: Cross-build release targets and verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          version="v0.0.0-ci"
          build_date="2000-01-01T00:00:00Z"
          ldflags="-s -w -X github.com/odango-chan/ca-client-tools/internal/cli.Version=${version} -X github.com/odango-chan/ca-client-tools/internal/cli.GitCommit=${GITHUB_SHA} -X github.com/odango-chan/ca-client-tools/internal/cli.BuildDate=${build_date}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="${ldflags}" -o dist/ca-client-tools-windows-amd64.exe ./cmd/ca-client-tools
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="${ldflags}" -o dist/ca-client-tools-linux-amd64 ./cmd/ca-client-tools
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="${ldflags}" -o dist/ca-client-tools-linux-arm64 ./cmd/ca-client-tools
          expected="ca-client-tools ${version} (commit ${GITHUB_SHA}; built ${build_date})"
          actual="$(dist/ca-client-tools-linux-amd64 --version)"
          test "${actual}" = "${expected}"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -count=1
      - name: Provider fixture tests
        run: go test -tags providerfixture ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Provider fixture vet
        run: go vet -tags providerfixture ./...
      - name: Acceptance tooling vet
        run: go vet -tags acceptance ./scripts/acceptance/
      - name: Build
        run: go build ./...
      - name: Build and run versioned Windows executable
        shell: pwsh
        run: |
          $version = "v0.0.0-ci"
          $buildDate = "2000-01-01T00:00:00Z"
          $ldflags = "-s -w -X github.com/odango-chan/ca-client-tools/internal/cli.Version=$version -X github.com/odango-chan/ca-client-tools/internal/cli.GitCommit=$env:GITHUB_SHA -X github.com/odango-chan/ca-client-tools/internal/cli.BuildDate=$buildDate"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -buildvcs=false -ldflags="$ldflags" -o dist/ca-client-tools-windows-amd64.exe ./cmd/ca-client-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "ca-client-tools $version (commit $env:GITHUB_SHA; built $buildDate)"
          $actual = & .\dist\ca-client-tools-windows-amd64.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $expected) {
            Write-Error "Version output mismatch. Expected: $expected; actual: $actual"
            exit 1
          }
