apiVersion: ca-client-tools.provider-bindings/v2
kind: ProviderBackendBindingCatalog
# Trusted private backend-operation bindings for the P0 read-only slice.
# This is the single embedded Catalog: it keeps the eight private SMF context
# IDs and the three source-verified OpenAMSM list operations so the unified
# Provider can expose all eleven existing read-only tools. The legacy v1
# artifact and its loader were removed; there is no version dispatch.
#
# This catalog is trusted package content embedded in the Provider build. It is
# NOT a CapabilityContracts grant and NOT a Skill-authored Operation Manifest.
# It is, however, the single canonical source for the public Tool contracts of
# the published READ tools (`spec.tools`): the release generator derives the
# Compiler Interface Package and the runtime `provider.yaml` from this file, so
# no Host or Compiler adapter re-authors the public callable identity, Schema
# reference, Effect, Owner outcomes or Capability membership. Capability
# authorization and Scope still remain Host/Runtime owned.
metadata:
  providerId: ca-client-tools.sbi
  catalogVersion: "2"
  interface:
    packageId: urn:wtlab:ca-client-tools:openamsm-sbi-interface
    name: ca-client-tools-openamsm-sbi
    publisher: ca-client-tools
    owner: ca-client-tools
  sources:
    - sourceId: openamsm-mas-context-openapi
      kind: openapi
      repository: odango-chan/env-openamsm
      commit: 594dec78b95bff4fdc34deac8a3a9681fb41228f
      path: upstream/openamsm/tools/nw-agent/openapi/Nsmf_MasContextQuery.yaml
      gitBlobSha: 46045c2f8f1cae31c6e6c98d5d20addbebe41969
    - sourceId: openamsm-amf-init-c
      kind: openamsm-source
      repository: odango-chan/env-openamsm
      commit: 594dec78b95bff4fdc34deac8a3a9681fb41228f
      path: upstream/openamsm/src/amf/init.c
      gitBlobSha: 1ee5c9b148c68ceb7ceb377a29e982b3c9985878
    - sourceId: openamsm-smf-init-c
      kind: openamsm-source
      repository: odango-chan/env-openamsm
      commit: 594dec78b95bff4fdc34deac8a3a9681fb41228f
      path: upstream/openamsm/src/smf/init.c
      gitBlobSha: ce8aea73ddcc0dddb84f6c839fe2f4b6c096a88b
spec:
  schemas:
    masContextResult:
      type: object
      additionalProperties: false
      required: [masId, status, key, context]
      properties:
        masId:
          type: string
          enum: [SC, PA, UPN, SSM, IAM, UPS, CA, SAA]
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        key:
          type: object
        context:
          type: object
    metricsPage:
      type: object
      additionalProperties: false
      required: [items, pager]
      properties:
        items:
          type: array
          items:
            type: object
        pager:
          type: object
          additionalProperties: false
          required: [page, page_size, count]
          properties:
            page:
              type: integer
              minimum: 0
            page_size:
              type: integer
              minimum: 1
              maximum: 100
            count:
              type: integer
              minimum: 0
            next:
              type: string
            prev:
              type: string
            truncated:
              type: boolean
    problemDetails:
      type: object
      additionalProperties: false
      required: [status, cause]
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        cause:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
  bindings:
    - backendOperationId: openamsm.smf.mas.sc.query
      effect: READ
      handler: openamsmSMFContextQuery
      serviceKey: openamsm-smf-context
      contextType: SC
      source:
        sourceId: openamsm-mas-context-openapi
        operationId: queryScContext
      request:
        mediaType: application/json
      response:
        mediaTypes: [application/json]
        schemaRef: masContextResult
      arguments:
        - name: supi
          type: string
          required: true
          pattern: '^imsi-[0-9]{1,15}$'
        - name: pduSessionId
          type: integer
          required: true
          minimum: 0
          maximum: 255

    - backendOperationId: openamsm.smf.mas.pa.query
      effect: READ
      handler: openamsmSMFContextQuery
      serviceKey: openamsm-smf-context
      contextType: PA
      source:
        sourceId: openamsm-mas-context-openapi
        operationId: queryPaContext
      request:
        mediaType: application/json
      response:
        mediaTypes: [application/json]
        schemaRef: masContextResult
      arguments:
        - name: supi
          type: string
          required: true
          pattern: '^imsi-[0-9]{1,15}$'
        - name: pduSessionId
          type: integer
          required: true
          minimum: 0
          maximum: 255

    - backendOperationId: openamsm.smf.mas.upn.query
      effect: READ
      handler: openamsmSMFContextQuery
      serviceKey: openamsm-smf-context
      contextType: UPN
      source:
        sourceId: openamsm-mas-context-openapi
        operationId: queryUpnContext
      request:
        mediaType: application/json
      response:
        mediaTypes: [application/json]
        schemaRef: masContextResult
      arguments:
        - name: supi
          type: string
          required: true
          pattern: '^imsi-[0-9]{1,15}$'
        - name: pduSessionId
          type: integer
          required: true
          minimum: 0
          maximum: 255

    - backendOperationId: openamsm.smf.mas.ssm.query
      effect: READ
      handler: openamsmSMFContextQuery
      serviceKey: openamsm-smf-context
      contextType: SSM
      source:
        sourceId: openamsm-mas-context-openapi
        operationId: querySsmContext
      request:
        mediaType: application/json
      response:
        mediaTypes: [application/json]
        schemaRef: masContextResult
      arguments:
        - name: supi
          type: string
