          type: integer
          required: false
          minimum: 0
          default: 0
        - name: pageSize
          type: integer
          required: false
          minimum: 1
          maximum: 100
          default: 100

  # Standalone JSON Schema sources for the public Tool contracts. Each file is
  # authored once in YAML and converted deterministically to the JSON Schema
  # file exported by the Compiler Interface Package. The $id must be an
  # absolute URI without a fragment; identities are WTLab-owned because these
  # are project-defined projections, not verbatim 3GPP Schemas.
  schemaFiles:
    - id: urn:wtlab:ca-client-tools:openamsm:mas-context-query-input:v1
      path: schemas/mas-context-query-input.schema.yaml
    - id: urn:wtlab:ca-client-tools:openamsm:mas-context-result:v1
      path: schemas/mas-context-result.schema.yaml
    - id: urn:wtlab:ca-client-tools:openamsm:metrics-page-query:v1
      path: schemas/metrics-page-query.schema.yaml
    - id: urn:wtlab:ca-client-tools:openamsm:metrics-page:v1
      path: schemas/metrics-page.schema.yaml

  # Canonical public Tool contracts. `callableId` is the Compiler Callable
  # ExportId and the Host-facing public identity; `backendOperationId` names the
  # private binding above. READ tools are the only tools published to the
  # Compiler Interface Package in this release: the Owner publishes no
  # receipt/commit-proof/reconcile contract for any Provider mutation binding,
  # so no MUTATION callable is exported and no receipt is fabricated here.
  tools:
    - callableId: openamsm.smf.mas.sc.query
      backendOperationId: openamsm.smf.mas.sc.query
      kind: observation
      effect: READ
      ownerOutcomes: [SUCCEEDED, FAILED]
      capabilities: [openamsm.smf.mas.context.read]
      queryContextSchema:
        $ref: urn:wtlab:ca-client-tools:openamsm:mas-context-query-input:v1
      outputSchema:
        $ref: urn:wtlab:ca-client-tools:openamsm:mas-context-result:v1

    - callableId: openamsm.smf.mas.pa.query
