        schemaRef: masContextResult
      arguments:
        - name: supi
          type: string
          required: true
          pattern: '^imsi-[0-9]{1,15}$'
        - name: pduSessionId
          type: integer
          required: true
          minimum: 0
          maximum: 255

    - backendOperationId: openamsm.smf.mas.saa.query
      effect: READ
      handler: openamsmSMFContextQuery
      serviceKey: openamsm-smf-context
      contextType: SAA
      source:
