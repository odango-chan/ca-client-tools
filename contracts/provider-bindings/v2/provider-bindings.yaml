      outputSchema:
        $ref: urn:wtlab:ca-client-tools:openamsm:mas-context-result:v1

    - callableId: openamsm.smf.mas.iam.query
      backendOperationId: openamsm.smf.mas.iam.query
      kind: observation
      effect: READ
      ownerOutcomes: [SUCCEEDED, FAILED]
