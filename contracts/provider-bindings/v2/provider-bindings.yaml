          minimum: 1
          maximum: 100
          default: 100

    - backendOperationId: openamsm.smf.pdu-info.list
      effect: READ
      handler: openamsmSMFMetricsList
      serviceKey: openamsm-smf-metrics
      source:
        sourceId: openamsm-smf-init-c
        operationId: listSmfPDUInfo
        sourceSymbol: smf_dump_pdu_info
