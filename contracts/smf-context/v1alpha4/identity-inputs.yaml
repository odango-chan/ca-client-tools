apiVersion: connectionagent.io/callable-identity-inputs/v1alpha4
kind: CallableIdentityInputs
metadata:
  owner: ca-client-tools
spec:
  callables:
    - owner: ca-client-tools
      kind: observation
      id: smf.context.session.query
      identityInputs:
        - dimension: subject
          path: supi
        - dimension: session
          path: pduSessionId

    - owner: ca-client-tools
      kind: observation
      id: smf.context.policy.query
      identityInputs:
        - dimension: subject
          path: supi
        - dimension: session
          path: pduSessionId

    - owner: ca-client-tools
      kind: observation
      id: smf.context.up-node.query
      identityInputs:
