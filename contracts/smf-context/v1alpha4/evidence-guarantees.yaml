smf.context.session.query-result:
  authority: smf-owner
  fact: smf.context.session.query-result
  producers:
    - owner: ca-client-tools
      kind: observation
      id: smf.context.session.query
      outcome: SUCCEEDED
      path: output
  scope:
    subject: {record: scope.subject, equals: query.supi}
    session: {record: scope.session.pduSessionId, equals: query.pduSessionId}
  correlation:
    invocation: {record: invocationId, equals: execution.invocationId}
    producerInvocation: {record: producerInvocationId, equals: execution.producerInvocationId}
  factValue: value
  selection: {mode: exact}

